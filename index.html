<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fd1">
<title>Kamera Ringan</title>
<style>
:root{--bg:#f3f5f8;--ink:#14202e;--mute:#5b6b7d;--blue:#1f5fd1;--blue-d:#174aa6;--ok:#16794a;--warn:#b4570a;--line:#d9e0e8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:14px 18px 10px}
h1{font-size:1.35rem;font-weight:700;color:var(--blue);letter-spacing:-.01em}
header p{font-size:.88rem;color:var(--mute);margin-top:2px}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 14px 14px;gap:12px;max-width:640px;width:100%;margin:0 auto}
.stage{position:relative;flex:1;min-height:0;background:#0d141c;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
video,#hasil{width:100%;height:100%;object-fit:contain;display:block}
video.depan{transform:scaleX(-1)}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#fff;font-size:.95rem;line-height:1.5;background:rgba(13,20,28,.88)}
.msg[hidden],[hidden]{display:none!important}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:putar 0.9s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
.info{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.9rem}
.info b{display:block;font-size:.76rem;font-weight:600;color:var(--mute)}
.status{grid-column:1/-1;font-weight:600;padding-top:6px;border-top:1px solid var(--line)}
.status.ok{color:var(--ok)}.status.gagal{color:var(--warn)}
.bar{display:flex;align-items:center;justify-content:center;gap:14px}
button{font:inherit;border:0;border-radius:14px;cursor:pointer;min-height:56px;padding:0 20px;font-weight:600;font-size:1rem;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #8fb4f5;outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.utama{background:var(--blue);color:#fff;flex:1;min-height:64px;font-size:1.1rem}
.utama:active:not(:disabled){background:var(--blue-d)}
.sekunder{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.sekunder:active:not(:disabled){background:#e8effc}
.bar .sekunder{flex:1}
</style>
</head>
<body>
<header>
  <h1>Kamera Ringan</h1>
  <p>Ambil foto, kompres otomatis, simpan di bawah 1 MB.</p>
</header>
<main>
  <section class="stage" aria-live="polite">
    <video id="video" autoplay playsinline muted></video>
    <img id="hasil" alt="Hasil foto terkompresi" hidden>
    <div class="msg" id="pesan" hidden></div>
  </section>
  <section class="info" id="info" hidden>
    <div><b>Ukuran file</b><span id="iUkuran"></span></div>
    <div><b>Resolusi</b><span id="iResolusi"></span></div>
    <div class="status" id="iStatus"></div>
  </section>
  <div class="bar" id="barKamera">
    <button class="sekunder" id="btnGanti" type="button" disabled>Ganti Kamera</button>
    <button class="utama" id="btnFoto" type="button" disabled>Ambil Foto</button>
  </div>
  <div class="bar" id="barHasil" hidden>
    <button class="sekunder" id="btnUlang" type="button">Ambil Ulang</button>
    <button class="utama" id="btnSimpan" type="button">Simpan Foto</button>
  </div>
</main>

<script>
(() => {
  const BATAS = 999999; // byte, kurang dari 1 MB
  const $ = id => document.getElementById(id);
  const video = $('video'), hasil = $('hasil'), pesan = $('pesan'), info = $('info');
  const btnGanti = $('btnGanti'), btnFoto = $('btnFoto'), btnUlang = $('btnUlang'), btnSimpan = $('btnSimpan');

  let stream = null, arah = 'environment', mode = 'kamera', sibuk = false;
  let blobAkhir = null, urlAkhir = null, namaFile = '';

  function tampilPesan(html, spinner) {
    pesan.innerHTML = (spinner ? '<div class="spin"></div>' : '') + '<div>' + html + '</div>';
    pesan.hidden = false;
  }
  const sembunyiPesan = () => { pesan.hidden = true; };

  function hentikanKamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
  }

  function pesanError(e) {
    const n = e && e.name;
    if (!window.isSecureContext || !navigator.mediaDevices)
      return 'Kamera hanya bisa dipakai lewat HTTPS. Buka aplikasi dari alamat https:// (misalnya GitHub Pages).';
    if (n === 'NotAllowedError' || n === 'SecurityError')
      return 'Izin kamera ditolak. Ketuk ikon gembok di kolom alamat Chrome, pilih Izin, aktifkan Kamera, lalu muat ulang halaman.';
    if (n === 'NotFoundError' || n === 'OverconstrainedError')
      return 'Kamera tidak ditemukan di perangkat ini. Pastikan HP memiliki kamera, lalu coba lagi.';
    if (n === 'NotReadableError' || n === 'AbortError')
      return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi yang memakai kamera, lalu coba lagi.';
    return 'Kamera tidak dapat dibuka (' + (n || 'kesalahan tidak dikenal') + '). Muat ulang halaman dan coba lagi.';
  }

  async ambilStream(a) {
    const dasar = { width: { ideal: 1920 }, height: { ideal: 1080 } };
    try { // coba paksa arah kamera agar benar-benar berganti perangkat
      return await navigator.mediaDevices.getUserMedia({ video: { ...dasar, facingMode: { exact: a } }, audio: false });
    } catch (e) {
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError' || e.name === 'NotReadableError') throw e;
      return await navigator.mediaDevices.getUserMedia({ video: { ...dasar, facingMode: { ideal: a } }, audio: false });
    }
  }

  async function mulaiKamera() {
    btnFoto.disabled = true; btnGanti.disabled = true;
    hentikanKamera();
    tampilPesan('Membuka kamera…', true);
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext)
        throw { name: 'Tidakaman' };
      stream = await ambilStream.call(null, arah);
      const t = stream.getVideoTracks()[0];
      t.addEventListener('ended', () => {
        if (mode === 'kamera') { hentikanKamera(); btnFoto.disabled = true; tampilPesan('Kamera terputus atau izin dicabut. Ketuk Ganti Kamera atau muat ulang halaman.'); btnGanti.disabled = false; }
      });
      const f = (t.getSettings().facingMode) || arah;
      arah = f === 'user' ? 'user' : 'environment';
      video.classList.toggle('depan', arah === 'user');
      video.srcObject = stream;
      await video.play();
      sembunyiPesan();
      btnFoto.disabled = false; btnGanti.disabled = false;
    } catch (e) {
      tampilPesan(pesanError(e));
      btnGanti.disabled = !(navigator.mediaDevices && window.isSecureContext);
    }
  }

  async function gantiKamera() {
    if (sibuk) return;
    arah = arah === 'environment' ? 'user' : 'environment';
    await mulaiKamera();
  }

  const keBlob = (canvas, q) => new Promise(r => canvas.toBlob(r, 'image/jpeg', q));

  async function kompres(sumber, w0, h0) {
    // Tahap 1: turunkan kualitas; tahap 2: kecilkan dimensi bila perlu
    const skala = [1, 0.85, 0.72, 0.6, 0.5, 0.4, 0.32];
    const kualitas = [0.9, 0.82, 0.74, 0.66, 0.58, 0.5];
    const MIN_SISI = 480;
    let terbaik = null;
    for (const s of skala) {
      let w = Math.round(w0 * s), h = Math.round(h0 * s);
      if (Math.min(w, h) < MIN_SISI && s !== 1) break;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(sumber, 0, 0, w, h);
      for (const q of kualitas) {
        const b = await keBlob(c, q);
        if (!b) throw new Error('Gagal membuat JPEG');
        terbaik = { blob: b, w, h };
        if (b.size <= BATAS) return terbaik;
      }
      await new Promise(r => setTimeout(r));
    }
    // Upaya terakhir: kualitas lebih rendah pada dimensi terkecil yang dicoba
    const c = document.createElement('canvas');
    c.width = terbaik.w; c.height = terbaik.h;
    c.getContext('2d').drawImage(sumber, 0, 0, terbaik.w, terbaik.h);
    for (const q of [0.4, 0.3, 0.2]) {
      const b = await keBlob(c, q);
      if (!b) break;
      terbaik = { blob: b, w: c.width, h: c.height };
      if (b.size <= BATAS) break;
    }
    return terbaik;
  }

  function formatUkuran(b) {
    return b >= 1e6 ? (b / 1e6).toFixed(2).replace('.', ',') + ' MB' : Math.round(b / 1000) + ' KB';
  }
  const dua = n => String(n).padStart(2, '0');
  function buatNama() {
    const d = new Date();
    return 'KameraRingan_' + d.getFullYear() + dua(d.getMonth() + 1) + dua(d.getDate()) + '_' + dua(d.getHours()) + dua(d.getMinutes()) + dua(d.getSeconds()) + '.jpg';
  }

  async function ambilFoto() {
    if (sibuk || !stream || !video.videoWidth) return;
    sibuk = true;
    btnFoto.disabled = true; btnGanti.disabled = true;
    const w = video.videoWidth, h = video.videoHeight;
    const asli = document.createElement('canvas');
    asli.width = w; asli.height = h;
    asli.getContext('2d').drawImage(video, 0, 0, w, h); // tidak dicerminkan, urutan sesuai tampilan kamera
    tampilPesan('Memproses dan mengompres foto…', true);
    try {
      const hs = await kompres(asli, w, h);
      asli.width = asli.height = 1; // lepas memori hasil asli
      const ukuran = hs.blob.size; // diverifikasi dari Blob.size
      blobAkhir = hs.blob;
      namaFile = buatNama();
      if (urlAkhir) URL.revokeObjectURL(urlAkhir);
      urlAkhir = URL.createObjectURL(blobAkhir);
      hasil.src = urlAkhir;
      hentikanKamera();
      mode = 'hasil';
      video.hidden = true; hasil.hidden = false;
      $('iUkuran').textContent = formatUkuran(ukuran);
      $('iResolusi').textContent = hs.w + ' × ' + hs.h;
      const st = $('iStatus');
      if (ukuran <= BATAS) { st.textContent = 'Berhasil di bawah 1 MB'; st.className = 'status ok'; }
      else { st.textContent = 'Belum memenuhi target (masih ' + formatUkuran(ukuran) + ')'; st.className = 'status gagal'; }
      info.hidden = false;
      $('barKamera').hidden = true; $('barHasil').hidden = false;
      sembunyiPesan();
    } catch (e) {
      tampilPesan('Foto gagal diproses. Ketuk Ambil Ulang untuk mencoba lagi.');
      mode = 'kamera';
      await mulaiKamera();
    } finally {
      sibuk = false;
    }
  }

  async function ambilUlang() {
    mode = 'kamera';
    hasil.hidden = true; hasil.removeAttribute('src'); video.hidden = false;
    info.hidden = true; blobAkhir = null;
    if (urlAkhir) { URL.revokeObjectURL(urlAkhir); urlAkhir = null; }
    $('barHasil').hidden = true; $('barKamera').hidden = false;
    await mulaiKamera();
  }

  function simpan() {
    if (!blobAkhir) return;
    const a = document.createElement('a');
    a.href = urlAkhir; a.download = namaFile;
    document.body.appendChild(a); a.click(); a.remove(); // mengunduh blob terkompresi
  }

  btnGanti.addEventListener('click', gantiKamera);
  btnFoto.addEventListener('click', ambilFoto);
  btnUlang.addEventListener('click', ambilUlang);
  btnSimpan.addEventListener('click', simpan);

  document.addEventListener('visibilitychange', () => {
    if (mode !== 'kamera' || sibuk) return;
    if (document.hidden) { hentikanKamera(); btnFoto.disabled = true; }
    else mulaiKamera();
  });
  window.addEventListener('pagehide', hentikanKamera);

  mulaiKamera();
})();
</script>
</body>
</html>
